name: uptime-monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run health checks
        id: check
        run: bash check.sh
        continue-on-error: true

      - name: Commit STATUS.md if changed
        run: |
          git config user.name "uptime-bot"
          git config user.email "actions@github.com"
          # タイムスタンプ行だけの差分ならコミットしない
          if ! git diff --quiet -I '最終チェック' -- STATUS.md; then
            git add STATUS.md
            git commit -m "status: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')"
            git pull --rebase origin main
            git push
          fi

      - name: Fail workflow if any app is down
        if: steps.check.outcome == 'failure'
        run: exit 1
