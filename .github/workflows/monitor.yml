name: uptime-monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run health checks
        id: check
        run: bash check.sh
        continue-on-error: true

      - name: Commit STATUS.md if changed
        run: |
          git config user.name "uptime-bot"
          git config user.email "actions@github.com"
          # タイムスタンプ行だけの差分ならコミットしない
          if ! git diff --quiet -I '最終チェック' -- STATUS.md; then
            git add STATUS.md
            git commit -m "status: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')"
            git pull --rebase origin main
            git push
          fi

      - name: Notify Slack DM on failure
        if: steps.check.outcome == 'failure'
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          [ -z "$WEBHOOK" ] && { echo "SLACK_WEBHOOK_URL未設定、通知スキップ"; exit 0; }
          DOWN=$(cat failed.txt)
          PAYLOAD=$(jq -n --arg text "🔴 *アプリ障害検知*
          $DOWN
          詳細: https://github.com/igawowwow/uptime/blob/main/STATUS.md" '{text: $text}')
          curl -s -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$WEBHOOK"

      - name: Notify Slack DM on recovery
        if: steps.check.outcome == 'success'
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -z "$WEBHOOK" ] && exit 0
          PREV=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow uptime-monitor --status completed --limit 1 --json conclusion --jq '.[0].conclusion')
          if [ "$PREV" = "failure" ]; then
            curl -s -X POST -H 'Content-type: application/json' \
              --data '{"text":"🟢 *全アプリ復旧* 全14アプリ正常応答に戻った。"}' "$WEBHOOK"
          fi

      - name: Fail workflow if any app is down
        if: steps.check.outcome == 'failure'
        run: exit 1
