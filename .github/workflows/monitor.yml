name: uptime-monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run health checks
        id: check
        run: bash check.sh
        continue-on-error: true

      - name: Commit STATUS.md
        run: |
          git config user.name "uptime-bot"
          git config user.email "actions@github.com"
          # ステータスが変わった時に加えて、1日1回は必ずコミットする。
          # GitHubはリポジトリが60日無活動だとscheduleワークフローを自動停止する
          # (disabled_inactivity)。「変化時だけコミット」にしていると、全アプリが
          # 正常な限りコミットが発生せず、監視が正常に動いているほど自滅する。
          # 日次コミットは死活の証跡そのものでもある(止まればSTATUS.mdが古くなる)。
          LAST_COMMIT_DAY=$(git log -1 --format=%cd --date=format:%Y-%m-%d -- STATUS.md || echo "")
          TODAY=$(TZ=Asia/Tokyo date '+%Y-%m-%d')
          if [ -n "$(git status --porcelain -- state.txt)" ] || [ "$LAST_COMMIT_DAY" != "$TODAY" ]; then
            git add STATUS.md state.txt
            git commit -m "status: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')" || exit 0
            git pull --rebase origin main
            git push
          fi

      - name: Notify Slack DM on failure
        if: steps.check.outcome == 'failure'
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          [ -z "$WEBHOOK" ] && { echo "SLACK_WEBHOOK_URL未設定、通知スキップ"; exit 0; }
          DOWN=$(cat failed.txt)
          PAYLOAD=$(jq -n --arg text "🔴 *アプリ障害検知*
          $DOWN
          詳細: https://github.com/igawowwow/uptime/blob/main/STATUS.md" '{text: $text}')
          curl -s -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$WEBHOOK"

      - name: Notify Slack DM on recovery
        if: steps.check.outcome == 'success'
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -z "$WEBHOOK" ] && exit 0
          TOTAL=$(jq 'length' checks.json)
          PREV=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow uptime-monitor --status completed --limit 1 --json conclusion --jq '.[0].conclusion')
          if [ "$PREV" = "failure" ]; then
            curl -s -X POST -H 'Content-type: application/json' \
              --data "{\"text\":\"🟢 *全アプリ復旧* 全${TOTAL}件が正常応答に戻った。\"}" "$WEBHOOK"
          fi

      - name: Fail workflow if any app is down
        if: steps.check.outcome == 'failure'
        run: exit 1
